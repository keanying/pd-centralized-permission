<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDS 统一登录</title>
  <link rel="icon" href="/assets/pds-app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/pds.css">
</head>
<body>
<main class="card">
  <section class="brand">
    <div class="logo"><span class="mark">P</span><span>PDS</span></div>
    <div>
      <h1>PD 统一权限</h1>
      <p>一次登录，访问 PDK 知识服务、PDA 智能助手及集团各业务系统。</p>
      <div class="tags">
        <span>统一登录</span><span>角色授权</span><span>景区隔离</span><span>字段脱敏</span><span>访问审计</span>
      </div>
    </div>
    <div class="foot">请妥善保管账号密码，勿在公共设备上保存登录状态</div>
  </section>
  <section class="form">
    <h2>欢迎登录</h2>
    <p class="sub">请使用工号或账号登录</p>
    <div class="alert error" th:if="${error}" th:text="${error}">账号或密码错误</div>
    <div class="alert info" th:if="${message}" th:text="${message}">您已安全退出</div>
    <form method="post" th:action="@{/login}">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="请输入账号" required autofocus>
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
      <button type="submit">登 录</button>
    </form>
    <div class="links">忘记密码？请联系所在单位的系统管理员重置</div>
  </section>
</main>
</body>
</html>

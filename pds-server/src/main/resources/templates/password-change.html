<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 - PDS 统一登录</title>
  <link rel="icon" href="/assets/pds-app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/pds.css">
</head>
<body>
<main class="card">
  <section class="brand">
    <div class="logo"><span class="mark">P</span><span>PDS</span></div>
    <div>
      <h1>请先修改密码</h1>
      <p>为保障账号安全，首次登录或密码被重置后需要设置新密码。</p>
    </div>
    <div class="foot">修改完成后将自动继续之前的操作</div>
  </section>
  <section class="form">
    <h2>修改密码</h2>
    <p class="sub" th:text="'当前账号：' + ${username}">当前账号</p>
    <div class="alert error" th:if="${error}" th:text="${error}">错误</div>
    <form method="post" th:action="@{/password/change}">
      <label for="oldPassword">原密码</label>
      <input type="password" id="oldPassword" name="oldPassword" autocomplete="current-password" required>
      <label for="newPassword">新密码</label>
      <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
      <label for="confirmPassword">确认新密码</label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
      <p class="hint">至少 8 位，包含大写字母、小写字母、数字、特殊字符中的至少 3 类，且不能包含账号。</p>
      <button type="submit">确认修改</button>
    </form>
  </section>
</main>
</body>
</html>
